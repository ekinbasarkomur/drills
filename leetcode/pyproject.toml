[project]
name = "leetcode"
version = "0.1.0"
description = "LeetCode solutions in Python, plus the pandas and SQL tracks"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "duckdb>=1.1"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# python/: algorithms · pandas_track/: DataFrame problems (not pandas/: it would shadow the library) · sql/: queries, run on DuckDB (sql/conftest.py)
testpaths = ["python", "pandas_track", "sql"]
python_files = ["lc*.py"]
pythonpath = ["python"]
addopts = "-p no:cacheprovider --import-mode=importlib"
