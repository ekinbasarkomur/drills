[project]
name = "leetcode"
version = "0.1.0"
description = "LeetCode solutions in Python, plus the pandas and SQL tracks"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "duckdb>=1.1"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
# python/: algorithms · pandas_track/: DataFrame problems (not pandas/: it would shadow the library) · sql/: queries, run on DuckDB (sql/conftest.py)
testpaths = ["leetcode/python", "leetcode/pandas_track", "leetcode/sql"]
python_files = ["lc*.py"]
pythonpath = ["leetcode/python"]
addopts = "-p no:cacheprovider --import-mode=importlib"

[tool.pyright]
# pyright does not read pytest's pythonpath, and without venvPath it would use
# whatever python is on PATH instead of this project's.
venvPath = "."
venv = ".venv"
extraPaths = ["leetcode/python"]
